<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Expenses</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top"><h1>Expenses</h1><button class="ghost" id="gear" title="Connection settings" aria-label="Connection settings">⚙︎</button></header>
  <div class="searchbar"><span class="mag" aria-hidden="true">🔍</span>
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" aria-label="Search your expenses" placeholder="Search: maid, uber, food last month, over 500">
    <button class="clr" id="qclear" hidden aria-label="Clear search">✕</button></div>
  <div id="root"><p class="muted">Loading…</p></div>
</main>
<script src="app.js"></script>
<script>
const { $, esc, inr, inr2, monthLabel, monthShort, localDate, title, catIcon, catColor, payName } = App;
const S = { month: null, open: new Set(), q: "", limit: 30 };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const sum = rows => rows.reduce((a, r) => a + r.amount, 0);
const prevKey = k => { let y = +k.slice(0, 4), m = +k.slice(5) - 1; if (m < 1) { y--; m = 12; } return `${y}-${String(m).padStart(2, "0")}`; };
const nextKey = k => { let y = +k.slice(0, 4), m = +k.slice(5) + 1; if (m > 12) { y++; m = 1; } return `${y}-${String(m).padStart(2, "0")}`; };
const group = (rows, f) => { const m = new Map(); rows.forEach(r => { const k = f(r); (m.get(k) || m.set(k, []).get(k)).push(r); }); return m; };
const sorted = m => [...m].map(([k, v]) => [k, v, sum(v)]).sort((a, b) => b[2] - a[2]);

/* ---------- search ---------- */
const MON = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const STOP = new Set(["the","a","an","my","of","on","in","for","at","spent","spend","expense","expenses","payment","payments","paid","show","me","all","and"]);
const isoDay = d => localDate(d);
function parseQuery(raw) {
  let q = " " + raw.toLowerCase() + " "; const f = { terms: [], from: null, to: null, min: null, max: null, months: [], year: null, chips: [] };
  const take = (re, fn) => { q = q.replace(re, (...m) => { fn(m); return " "; }); };
  const now = new Date(), day = n => isoDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() + n));
  take(/\byesterday\b/, () => { f.from = f.to = day(-1); f.chips.push("Yesterday"); });
  take(/\btoday\b/, () => { f.from = f.to = day(0); f.chips.push("Today"); });
  take(/\blast month\b/, () => { const a = new Date(now.getFullYear(), now.getMonth() - 1, 1), b = new Date(now.getFullYear(), now.getMonth(), 0); f.from = isoDay(a); f.to = isoDay(b); f.chips.push("Last month"); });
  take(/\bthis month\b/, () => { f.from = isoDay(new Date(now.getFullYear(), now.getMonth(), 1)); f.to = day(0); f.chips.push("This month"); });
  take(/\b(?:last 7 days|last week|this week)\b/, () => { f.from = day(-6); f.to = day(0); f.chips.push("Last 7 days"); });
  take(/(?:>|\babove\b|\bover\b|\bmore than\b)\s*₹?\s*([\d,]+)/, m => { f.min = +m[1].replace(/,/g, ""); f.chips.push("Over " + inr(f.min)); });
  take(/(?:<|\bbelow\b|\bunder\b|\bless than\b)\s*₹?\s*([\d,]+)/, m => { f.max = +m[1].replace(/,/g, ""); f.chips.push("Under " + inr(f.max)); });
  take(/\b(20\d\d)\b/, m => { f.year = m[1]; f.chips.push(m[1]); });
  take(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/, m => { f.months.push(MON.indexOf(m[1]) + 1); f.chips.push(App.MN[MON.indexOf(m[1])]); });
  f.terms = q.split(/[\s,]+/).map(t => t.replace(/^[^\w₹]+|[^\w]+$/g, "")).filter(t => t && !STOP.has(t));
  return f;
}
function haystack(r) {
  return [payName(r), r.merchant, r.category, r.subcategory, r.description, r.note, r.mode, r.summary, (r.tags || []).join(" "), Math.round(r.amount), r.amount, r.date].join(" ").toLowerCase();
}
function matches(r, f) {
  if (f.from && r.date < f.from) return false; if (f.to && r.date > f.to) return false;
  if (f.min != null && r.amount <= f.min) return false; if (f.max != null && r.amount >= f.max) return false;
  if (f.year && !r.date.startsWith(f.year)) return false;
  if (f.months.length && !f.months.includes(+r.date.slice(5, 7))) return false;
  const h = haystack(r);
  return f.terms.every(t => h.includes(t) || (t.length > 3 && t.endsWith("s") && h.includes(t.slice(0, -1))));
}
function renderSearch(all) {
  const f = parseQuery(S.q), rows = all.filter(r => matches(r, f)), total = sum(rows);
  let h = `<div class="card"><div class="found">${rows.length} payment${rows.length === 1 ? "" : "s"} · ${inr(total)}</div>`;
  if (f.chips.length) h += `<div class="chips">${f.chips.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>`;
  if (rows.length) {
    const cats = sorted(group(rows, r => r.category)).slice(0, 5);
    if (cats.length > 1) h += `<div style="margin-top:10px">${cats.map(([c, , t]) => `<div class="chips" style="margin:2px 0"><button class="chip" data-q="${esc(c)}">${catIcon(c)} ${esc(c)} · ${inr(t)}</button></div>`).join("")}</div>`;
  }
  h += `</div>`;
  if (!rows.length) {
    h += `<div class="card"><p class="muted" style="margin:0">Nothing found for “${esc(S.q.trim())}”. Try a category (Household), a payee (Swiggy), a month (Oct), or an amount (over 500).</p></div>`;
  } else {
    h += `<div class="card">`; let last = "";
    rows.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.added || "").localeCompare(a.added || "")).slice(0, S.limit * 2).forEach(r => {
      if (r.date !== last) { h += `<div class="dayh">${dayLabel(r.date)}</div>`; last = r.date; } h += payRow(r, true); });
    if (rows.length > S.limit * 2) h += `<p style="text-align:center"><button id="more">Show more</button></p>`;
    h += `</div>`;
  }
  $("#root").innerHTML = h;
}

function dayLabel(d) {
  const t = localDate(), y = localDate(new Date(Date.now() - 864e5));
  if (d === t) return "Today"; if (d === y) return "Yesterday";
  return new Date(d + "T12:00:00").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
}

function payRow(r, big) {
  const sub = `${esc(r.category)} › ${esc(r.subcategory)} · ${esc(r.mode)}`;
  return big
    ? `<button class="pay big" data-id="${esc(r.id)}"><span class="ico">${catIcon(r.category)}</span><span class="t">${esc(payName(r))}</span><span class="s">${sub}${r.note ? " · " + esc(r.note) : ""}</span><span class="a">${inr2(r.amount)}</span></button>`
    : `<button class="pay" data-id="${esc(r.id)}"><span class="t">${esc(payName(r))}</span><span class="s">${dayLabel(r.date)}${r.note ? " · " + esc(r.note) : ""}</span><span class="a">${inr2(r.amount)}</span></button>`;
}

function render() {
  const all = App.debits();
  $("#qclear").hidden = !S.q;
  if (S.q.trim()) return renderSearch(all);
  const months = [...new Set(all.map(r => r.date.slice(0, 7)))].sort();
  const thisMonth = localDate().slice(0, 7);
  if (!S.month) S.month = months.includes(thisMonth) || !months.length ? thisMonth : months[months.length - 1];
  const isAll = S.month === "all";
  const rows = isAll ? all : all.filter(r => r.date.startsWith(S.month));
  const total = sum(rows);

  let h = "";
  // month switcher
  h += `<div class="months"><button id="mPrev" aria-label="Previous month" ${isAll ? "disabled" : ""}>‹</button>
    <div class="mlabel">${isAll ? "All time" : monthLabel(S.month)}</div>
    <button id="mNext" aria-label="Next month" ${isAll || S.month >= thisMonth ? "disabled" : ""}>›</button></div>
    <p style="text-align:center;margin:-6px 0 14px"><button class="chip ${isAll ? "on" : ""}" id="mAll">${isAll ? "Back to months" : "Show all time"}</button></p>`;

  // hero
  if (!all.length) {
    h += `<div class="card hero"><div class="big">₹0</div><div class="sub">No payments yet. Tap <b>＋ Add</b> to add your first one.</div></div>`;
  } else {
    let delta = "";
    if (!isAll) {
      const pk = prevKey(S.month), now = new Date();
      let prevRows = all.filter(r => r.date.startsWith(pk));
      let note = monthLabel(pk).split(" ")[0];
      if (S.month === thisMonth) { prevRows = prevRows.filter(r => +r.date.slice(8) <= now.getDate()); note = "the same days in " + note; }
      const pt = sum(prevRows);
      if (pt > 0) {
        const d = Math.round((total - pt) / pt * 100);
        delta = `<span class="delta ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d > 0 ? "▲" : d < 0 ? "▼" : "•"} ${Math.abs(d)}% ${d >= 0 ? "more" : "less"} than ${note}</span>`;
      }
    }
    const days = new Set(rows.map(r => r.date)).size || 1;
    h += `<div class="card hero"><div class="big">${inr(total)}</div>
      <div class="sub">${isAll ? "spent in total" : "spent in " + monthLabel(S.month).split(" ")[0]} · ${rows.length} payment${rows.length === 1 ? "" : "s"}</div>
      ${delta}<div class="muted" style="margin-top:8px;font-size:14px">About ${inr(total / days)} on each day you spent</div></div>`;
  }

  // possible duplicates (held out of the totals until you decide)
  const dups = App.dups();
  if (dups.length) {
    h += `<div class="card attn"><h2>${dups.length === 1 ? "A payment looks like a duplicate" : dups.length + " payments look like duplicates"}</h2><p style="margin:0 0 6px;font-size:14px">They are not counted until you decide.</p>` +
      dups.slice(0, 3).map(r => { const o = App.original(r);
        return `<div class="item" style="flex-wrap:wrap"><span>${esc(payName(r))} · ${inr2(r.amount)} · ${dayLabel(r.date)}<br><span style="font-size:13px;opacity:.85">${o ? `Same as ${esc(payName(o))} · ${inr2(o.amount)} · ${dayLabel(o.date)}` : "Same as an earlier payment"} (${esc(r.dup_reason || "similar")})</span></span>
          <span style="display:flex;gap:6px"><button data-keep="${esc(r.id)}">Add anyway</button><button data-drop="${esc(r.id)}">Don't add</button></span></div>`; }).join("") +
      (dups.length > 3 ? `<div style="font-size:13px;margin-top:6px">…and ${dups.length - 3} more</div>` : "") + `<div id="dupStat" class="stat"></div></div>`;
  }

  // needs attention
  const review = all.filter(r => r.review);
  if (review.length) {
    h += `<div class="card attn"><h2>${review.length} payment${review.length > 1 ? "s" : ""} need${review.length > 1 ? "" : "s"} a quick look</h2>` +
      review.slice(0, 3).map(r => `<div class="item"><span>${esc(payName(r))} · ${inr2(r.amount)}<br><span style="font-size:13px;opacity:.8">${dayLabel(r.date)}</span></span><button data-review="${esc(r.id)}">What was this?</button></div>`).join("") +
      (review.length > 3 ? `<div style="font-size:13px;margin-top:6px">…and ${review.length - 3} more</div>` : "") + `</div>`;
  }

  if (rows.length) {
    // where it went
    const cats = sorted(group(rows, r => r.category));
    h += `<div class="card"><h2>Where your money went</h2><div class="stack" role="img" aria-label="Share of spending by category">` +
      cats.map(([c, , t]) => `<i style="width:${t / total * 100}%;background:${catColor(c)}" title="${esc(c)} ${pct(t, total)}%"></i>`).join("") + `</div>`;
    cats.forEach(([c, crs, ct]) => {
      const open = S.open.has(c);
      h += `<div class="cat"><button class="row" data-cat="${esc(c)}" aria-expanded="${open}"><span class="ico">${catIcon(c)}</span><span class="nm">${esc(c)}</span><span class="pct">${pct(ct, total)}%</span><span class="amt">${inr(ct)}</span></button>
        <div class="mbar"><i style="width:${ct / cats[0][2] * 100}%;background:${catColor(c)}"></i></div>`;
      if (open) {
        h += `<div class="subs">`;
        sorted(group(crs, r => r.subcategory)).forEach(([s, srs, st]) => {
          const key = c + "|" + s, so = S.open.has(key);
          h += `<button class="row" data-sub="${esc(key)}" aria-expanded="${so}"><span class="nm">${esc(s)}</span><span class="pct">${pct(st, ct)}%</span><span class="amt">${inr(st)}</span></button>`;
          if (so) h += `<div class="pays">` + srs.slice().sort((a, b) => b.date.localeCompare(a.date)).map(r => payRow(r, false)).join("") + `</div>`;
        });
        h += `</div>`;
      }
      h += `</div>`;
    });
    h += `</div>`;

    // trend
    const byM = group(all, r => r.date.slice(0, 7));
    let ks = []; let k = isAll ? thisMonth : S.month; for (let i = 0; i < 6; i++) { ks.unshift(k); k = prevKey(k); }
    const vals = ks.map(k => sum(byM.get(k) || [])), mx = Math.max(...vals, 1);
    h += `<div class="card"><h2>Month by month</h2><div class="trend">` + ks.map((k, i) =>
      `<button data-month="${k}" class="${k === S.month ? "on" : ""}" aria-label="${monthLabel(k)} ${inr(vals[i])}"><span class="v">${vals[i] ? inr(vals[i]) : ""}</span><span class="b" style="height:${vals[i] / mx * 78}%"></span><span class="l">${monthShort(k)}</span></button>`).join("") + `</div></div>`;

    // how you paid
    const modes = sorted(group(rows, r => r.mode));
    h += `<div class="card"><h2>How you paid</h2><div class="modes">` + modes.map(([m, , t]) => `<span class="mode">${esc(m)} <b>${pct(t, total)}%</b> · ${inr(t)}</span>`).join("") + `</div></div>`;

    // insights
    const ins = [];
    const merch = sorted(group(rows.filter(r => r.category !== "Cash & Transfers"), r => (r.merchant || r.subcategory).toLowerCase()));
    if (merch.length) ins.push(`Most spent on <b>${esc(title(merch[0][0]))}</b>: ${inr(merch[0][2])} over ${merch[0][1].length} payment${merch[0][1].length > 1 ? "s" : ""}.`);
    const big = rows.slice().sort((a, b) => b.amount - a.amount)[0];
    ins.push(`Biggest single payment: <b>${inr2(big.amount)}</b> — ${esc(payName(big))}.`);
    if (rows.length >= 5) {
      const wd = sorted(group(rows, r => new Date(r.date + "T12:00:00").toLocaleDateString("en-IN", { weekday: "long" })));
      ins.push(`You spend the most on <b>${wd[0][0]}s</b> (${inr(wd[0][2])}).`);
    }
    h += `<div class="card"><h2>Worth knowing</h2><ul class="insights">${ins.map(i => `<li>${i}</li>`).join("")}</ul></div>`;

    // payments
    const list = rows.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.added || "").localeCompare(a.added || ""));
    h += `<div class="card"><h2>All payments</h2>`;
    let last = "";
    list.slice(0, S.limit).forEach(r => { if (r.date !== last) { h += `<div class="dayh">${dayLabel(r.date)}</div>`; last = r.date; } h += payRow(r, true); });
    if (list.length > S.limit) h += `<p style="text-align:center"><button id="more">Show ${Math.min(30, list.length - S.limit)} more</button></p>`;
    h += `</div>`;
  }
  $("#root").innerHTML = h;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.q) { S.q = t.dataset.q; $("#q").value = S.q; S.limit = 30; return render(); }
  if (t.id === "mPrev") { S.month = prevKey(S.month); S.limit = 30; return render(); }
  if (t.id === "mNext") { S.month = nextKey(S.month); S.limit = 30; return render(); }
  if (t.id === "mAll") { S.month = S.month === "all" ? null : "all"; S.limit = 30; return render(); }
  if (t.id === "more") { S.limit += 30; return render(); }
  if (t.dataset.month) { S.month = t.dataset.month; S.limit = 30; return render(); }
  const toggle = k => { S.open.has(k) ? S.open.delete(k) : S.open.add(k); render(); };
  if (t.dataset.cat) return toggle(t.dataset.cat);
  if (t.dataset.sub) return toggle(t.dataset.sub);
  if (t.dataset.keep || t.dataset.drop) {
    const keep = !!t.dataset.keep, id = t.dataset.keep || t.dataset.drop;
    document.querySelectorAll("[data-keep],[data-drop]").forEach(b => b.disabled = true);
    const st = $("#dupStat"); if (st) { st.className = "stat"; st.textContent = (keep ? "Adding" : "Removing") + "… (about 20 seconds)"; }
    App.resolveDuplicate(id, keep).then(() => render()).catch(err => { if (st) { st.className = "stat err"; st.textContent = err.message; } render(); });
    return;
  }
  const id = t.dataset.id || t.dataset.review;
  if (id) { const rec = App.state.RAW.find(r => r.id === id); if (rec) App.Sheet.open(rec, { onDone: () => render() }); }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; S.limit = 30; render(); } });
$("#qclear").onclick = () => { S.q = ""; $("#q").value = ""; render(); $("#q").focus(); };
$("#gear").onclick = () => App.connect().then(() => location.reload());

App.nav("summary");
App.start().then(render);
</script>
</body>
</html>
